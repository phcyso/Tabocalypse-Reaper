# Tabocalypse Reaper — local dev Docker setup (screenshots + headed testing).
#
# Usage (from repo root):
#   docker compose -f docker/docker-compose.yml up -d --build agent
#   docker compose -f docker/docker-compose.yml --profile selenium up -d selenium
#
# Both services bind-mount the repo read-write at /repo. The extension is
# delivered ONLY via the bind-mounted dist/ (dev path) — never baked in.

name: tabocalypse-reaper

services:
  # Agent-clicking image: Xvfb + openbox + firefox-esr + web-ext + xdotool.
  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tabocalypse-reaper-agent:local
    shm_size: "2g"
    environment:
      DISPLAY: ":99"
      SCREEN_GEOMETRY: "1920x1080x24"
    sysctls:
      # filler_server.py binds port 80 as non-root
      - net.ipv4.ip_unprivileged_port_start=80
    extra_hosts:
      # seeded .test filler hosts -> local pages (docker/filler_server.py)
