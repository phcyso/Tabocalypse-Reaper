      - ..:/repo
    working_dir: /repo
    # stays up for `docker exec` / helper wrappers
    command: ["sleep", "infinity"]

  # Scripted WebDriver route. Prebuilt upstream image — pull, don't rebuild.
  # Port 4444 (WebDriver) + 7900 (noVNC live view) exposed for local use.
  selenium:
    image: selenium/standalone-firefox:latest
    profiles: ["selenium"]
    shm_size: "2g"
    ports:
      - "4444:4444"
      - "7900:7900"
    environment:
      SE_SCREEN_WIDTH: "1920"
      SE_SCREEN_HEIGHT: "1080"
      SE_SCREEN_DEPTH: "24"
      # Firefox (recent versions) rejects privileged Marionette commands
      # (moz/context chrome, system-access execute_script) unless this is set.
      MOZ_REMOTE_ALLOW_SYSTEM_ACCESS: "1"
    volumes:
      - ..:/repo
    working_dir: /repo
