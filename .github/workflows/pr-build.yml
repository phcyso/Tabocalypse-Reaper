name: PR Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint extension
        run: npx web-ext lint

      - name: Build extension
        run: npx web-ext build --overwrite-dest

      - name: Upload artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension-unsigned
          path: web-ext-artifacts/*.zip
          retention-days: 30

      - name: Post artifact link to PR
        if: github.event_name == 'pull_request'
        env:
          ARTIFACT_URL: ${{ steps.upload_artifact.outputs.artifact-url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$ARTIFACT_URL" ]; then
            echo "No artifact URL available to post to the pull request." >&2
            exit 0
          fi

          body=$(cat <<EOF
<!-- pr-build-artifact -->
🔗 [Download PR build artifact]($ARTIFACT_URL)
EOF
)

          existing_comment_id=$(gh api \
            repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments \
            --paginate \
            --jq 'map(select(.user.login=="github-actions[bot]" and (.body | contains("<!-- pr-build-artifact -->")))) | .[0].id'
          )

          if [ -n "$existing_comment_id" ] && [ "$existing_comment_id" != "null" ]; then
            gh api \
              repos/$GITHUB_REPOSITORY/issues/comments/$existing_comment_id \
              -X PATCH \
              -f body="$body" \
              >/dev/null
          else
            gh pr comment "$PR_URL" --body "$body"
          fi
