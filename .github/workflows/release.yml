name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (typecheck, tests, build, web-ext lint)
        run: npm run lint

      - name: Build extension zip
        run: npm run build

      # AMO source-code submission package (TypeScript is transpiled, so
      # reviewers must be able to rebuild: see the README inside the zip).
      - name: Build AMO source package
        run: npm run package:source

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}

            Download the extension package below, then install via about:addons
            (Install Add-on From File) or load it temporarily through
            about:debugging. The `*-source.zip` is the AMO source-code
            submission package — attach it when AMO asks for source; the
            README inside documents the rebuild.

            Bump the version in src/manifest.json and
            package.json before tagging.
          files: web-ext-artifacts/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
