name: E2E Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox xvfb

      - name: Run unit tests
        run: npm run test:unit

      - name: Run E2E tests with xvfb
        run: |
          export DISPLAY=:99
          export HEADLESS=true
          npm run test:e2e
        continue-on-error: true

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-screenshots
          path: test-screenshots/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let comment = '## 🧪 E2E Test Results\n\n';
            
            // Check if screenshots exist
            const screenshotsDir = 'test-screenshots';
            if (fs.existsSync(screenshotsDir)) {
              const files = fs.readdirSync(screenshotsDir);
              comment += `✅ Generated ${files.length} screenshot(s)\n\n`;
              comment += 'Download the test artifacts to view screenshots.\n';
            } else {
              comment += '⚠️ No screenshots generated\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
