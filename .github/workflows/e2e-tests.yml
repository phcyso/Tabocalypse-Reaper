name: E2E Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox xvfb

      - name: Run unit tests
        id: unit-tests
        run: npm run test:unit

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2

      - name: Run E2E tests with xvfb
        id: e2e-tests
        run: |
          export DISPLAY=:99
          export HEADLESS=true
          export FORCE_E2E=true
          npm run test:e2e
        timeout-minutes: 5

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-screenshots
          path: test-screenshots/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let comment = '## 🧪 Test Results\n\n';
            
            // Check test results from previous steps
            const testsPassed = '${{ steps.unit-tests.outcome }}' === 'success' && '${{ steps.e2e-tests.outcome }}' === 'success';
            
            if (testsPassed) {
              comment += '✅ All tests passed\n\n';
            } else {
              comment += '❌ Some tests failed\n\n';
              if ('${{ steps.unit-tests.outcome }}' !== 'success') {
                comment += '- ❌ Unit tests failed\n';
              }
              if ('${{ steps.e2e-tests.outcome }}' !== 'success') {
                comment += '- ❌ E2E tests failed\n';
              }
              comment += '\n';
            }
            
            // Check if screenshots exist
            const screenshotsDir = 'test-screenshots';
            if (fs.existsSync(screenshotsDir)) {
              const files = fs.readdirSync(screenshotsDir);
              comment += `📸 Generated ${files.length} screenshot(s)\n\n`;
              comment += 'Download the test artifacts to view screenshots.\n';
            } else {
              comment += '⚠️ No screenshots generated\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
