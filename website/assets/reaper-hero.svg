<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="600" height="400" fill="url(#heroBgGradient)"/>

  <!-- Floating browser tabs (scattered around, some being reaped) -->
  <!-- Left side tabs -->
  <g opacity="0.9" class="tab-float">
    <rect x="50" y="80" width="80" height="60" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
    <circle cx="63" cy="95" r="6" fill="#7c3aed"/>
    <line x1="78" y1="95" x2="125" y2="95" stroke="#6b7280" stroke-width="3" opacity="0.3"/>
    <line x1="78" y1="110" x2="110" y2="110" stroke="#6b7280" stroke-width="3" opacity="0.3"/>
  </g>

  <g opacity="0.85" class="tab-float" transform="rotate(-8 100 180)">
    <rect x="40" y="180" width="75" height="55" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
    <circle cx="52" cy="195" r="5" fill="#9333ea"/>
    <line x1="65" y1="195" x2="105" y2="195" stroke="#6b7280" stroke-width="2.5" opacity="0.3"/>
    <line x1="65" y1="208" x2="95" y2="208" stroke="#6b7280" stroke-width="2.5" opacity="0.3"/>
  </g>

  <g opacity="0.8" class="tab-float" transform="rotate(12 80 290)">
    <rect x="80" y="290" width="70" height="50" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
    <circle cx="91" cy="303" r="5" fill="#7c3aed"/>
    <line x1="103" y1="303" x2="138" y2="303" stroke="#6b7280" stroke-width="2.5" opacity="0.3"/>
    <line x1="103" y1="315" x2="128" y2="315" stroke="#6b7280" stroke-width="2.5" opacity="0.3"/>
  </g>

  <!-- Right side tabs -->
  <g opacity="0.9" class="tab-float" transform="rotate(-5 480 100)">
    <rect x="480" y="100" width="85" height="62" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
    <circle cx="494" cy="116" r="6" fill="#7c3aed"/>
    <line x1="508" y1="116" x2="555" y2="116" stroke="#6b7280" stroke-width="3" opacity="0.3"/>
    <line x1="508" y1="130" x2="540" y2="130" stroke="#6b7280" stroke-width="3" opacity="0.3"/>
  </g>

  <g opacity="0.85" class="tab-float" transform="rotate(10 500 230)">
    <rect x="500" y="230" width="78" height="58" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
    <circle cx="513" cy="245" r="5" fill="#9333ea"/>
    <line x1="525" y1="245" x2="568" y2="245" stroke="#6b7280" stroke-width="2.5" opacity="0.3"/>
    <line x1="525" y1="258" x2="555" y2="258" stroke="#6b7280" stroke-width="2.5" opacity="0.3"/>
  </g>

  <!-- Top tabs -->
  <g opacity="0.8" class="tab-float" transform="rotate(-12 250 40)">
    <rect x="250" y="40" width="72" height="52" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
    <circle cx="262" cy="54" r="5" fill="#7c3aed"/>
    <line x1="273" y1="54" x2="310" y2="54" stroke="#6b7280" stroke-width="2.5" opacity="0.3"/>
    <line x1="273" y1="66" x2="300" y2="66" stroke="#6b7280" stroke-width="2.5" opacity="0.3"/>
  </g>

  <g opacity="0.75" class="tab-float" transform="rotate(8 380 50)">
    <rect x="380" y="50" width="68" height="50" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
    <circle cx="391" cy="63" r="5" fill="#9333ea"/>
    <line x1="402" y1="63" x2="437" y2="63" stroke="#6b7280" stroke-width="2.5" opacity="0.3"/>
    <line x1="402" y1="75" x2="427" y2="75" stroke="#6b7280" stroke-width="2.5" opacity="0.3"/>
  </g>

  <!-- Central Reaper Character (larger version) -->
  <g transform="translate(200, 80)">
    <!-- Purple robe/body -->
    <path d="M 100 240 Q 50 210 42 150 L 42 105 Q 42 75 62 60 Q 82 45 100 45 Q 118 45 138 60 Q 158 75 158 105 L 158 150 Q 150 210 100 240 Z" fill="url(#heroRobeGradient)"/>

    <!-- Arms -->
    <ellipse cx="48" cy="120" rx="18" ry="35" fill="url(#heroRobeGradient)" transform="rotate(-20 48 120)"/>
    <ellipse cx="152" cy="120" rx="18" ry="35" fill="url(#heroRobeGradient)" transform="rotate(20 152 120)"/>

    <!-- Hood -->
    <ellipse cx="100" cy="70" rx="60" ry="55" fill="url(#heroHoodGradient)"/>

    <!-- Hood shadow -->
    <ellipse cx="100" cy="90" rx="48" ry="42" fill="#3b0764" opacity="0.3"/>

    <!-- Skull face -->
    <ellipse cx="100" cy="82" rx="42" ry="48" fill="#f5f5f7"/>

    <!-- Eyes (big friendly circles) -->
    <circle cx="85" cy="75" r="10" fill="#7c3aed"/>
    <circle cx="115" cy="75" r="10" fill="#7c3aed"/>

    <!-- Eye highlights -->
    <circle cx="88" cy="72" r="4" fill="#ffffff"/>
    <circle cx="118" cy="72" r="4" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M 100 90 L 96 97 L 104 97 Z" fill="#6b21a8" opacity="0.5"/>

    <!-- Mouth (happy smile) -->
    <path d="M 80 105 Q 100 115 120 105" stroke="#7c3aed" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Cheek blushes -->
    <ellipse cx="70" cy="92" rx="8" ry="5" fill="#c084fc" opacity="0.3"/>
    <ellipse cx="130" cy="92" rx="8" ry="5" fill="#c084fc" opacity="0.3"/>

    <!-- Left hand holding scythe -->
    <circle cx="165" cy="130" r="12" fill="#f5f5f7"/>

    <!-- Scythe handle -->
    <line x1="165" y1="130" x2="190" y2="60" stroke="#6b21a8" stroke-width="6" stroke-linecap="round"/>

    <!-- Scythe blade (larger) -->
    <path d="M 190 60 Q 210 50 220 55 Q 230 60 225 73 Q 218 86 190 88 Z" fill="url(#heroBlade Gradient)"/>

    <!-- Blade shine -->
    <path d="M 195 65 Q 205 60 210 65 Q 212 70 205 78" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- Right hand (waving or gesturing) -->
    <circle cx="35" cy="140" r="12" fill="#f5f5f7"/>
  </g>

  <!-- Sparkles and effects -->
  <circle cx="180" cy="120" r="4" fill="#a855f7" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="180" r="3" fill="#c084fc" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="90" r="5" fill="#a855f7" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="300" r="3.5" fill="#c084fc" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="320" r="4" fill="#a855f7" opacity="0.65">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Decorative swirl effects -->
  <path d="M 140 340 Q 160 350 180 345" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.3" stroke-dasharray="5,5"/>
  <path d="M 440 360 Q 420 370 400 365" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.3" stroke-dasharray="5,5"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="heroBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3e8ff;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="heroRobeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="heroHoodGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6b21a8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="heroBladeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4b5fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9d5ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Tab floating animation style (would be applied via CSS) -->
  <style>
    .tab-float {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
  </style>
</svg>
